<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>
    <header><h1>Expense Tracker</h1></header>
    <section>
        <input type="text" name="expenseName" id="expenseName" placeholder="Expense name">
        <input type="number" name="number" id="expenseAmount" placeholder="Amount">
        
        <select id="expenseCategory">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Tech">Tech</option>
       </select>
    </section>
    <button id="addBtn">Add Expense</button>
    <h2>Total:Tk. <span id="total">0</span></h2>
    <ul id="expenseList"></ul>

    <script src="scripts.js"></script>
</body>
</html>
